name: Refresh ŁKS dashboard data

on:
  schedule:
    # Główne poranne odświeżenie.
    - cron: "17 7 * * 2"
      timezone: "Europe/Warsaw"
    - cron: "17 7 * * 0,1,3,4,5,6"
      timezone: "Europe/Warsaw"

    # Zapasowy poranny trigger. Jeśli główny zadziałał, kontrola świeżości
    # zatrzyma workflow przed RapidAPI, więc nie zużyjemy drugiego requestu.
    - cron: "13 13 * * 2"
      timezone: "Europe/Warsaw"
    - cron: "13 13 * * 0,1,3,4,5,6"
      timezone: "Europe/Warsaw"

    # Po weekendowych dniach meczowych: świeża tabela + terminarz.
    - cron: "30 22 * * 5,6,0"
      timezone: "Europe/Warsaw"

    # Awaryjny wieczorny trigger; normalnie kończy się bez requestu.
    - cron: "37 23 * * 5,6,0"
      timezone: "Europe/Warsaw"

  workflow_dispatch:
    inputs:
      mode:
        description: "Zakres aktualizacji"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - matches

permissions:
  contents: write

concurrency:
  group: lks-repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Choose refresh mode
        id: refresh_mode
        shell: bash
        run: |
          MODE="matches"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "17 7 * * 2" ]] ||                [[ "${{ github.event.schedule }}" == "13 13 * * 2" ]] ||                [[ "${{ github.event.schedule }}" == "30 22 * * 5,6,0" ]] ||                [[ "${{ github.event.schedule }}" == "37 23 * * 5,6,0" ]]; then
            MODE="full"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Wybrany tryb: $MODE"

      - name: Check whether API refresh is needed
        id: freshness
        shell: bash
        run: |
          # Ręczne uruchomienie zawsze wykonujemy zgodnie z wyborem użytkownika.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_api=true" >> "$GITHUB_OUTPUT"
            echo "Uruchomienie ręczne — pomijam kontrolę świeżości."
            exit 0
          fi

          if python scripts/check_refresh_freshness.py               --mode "${{ steps.refresh_mode.outputs.mode }}"               --max-age-hours 7; then
            echo "run_api=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_api=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh dashboard and smart opponent context
        if: steps.freshness.outputs.run_api == 'true'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        shell: bash
        run: |
          python scripts/update_dashboard.py --mode "${{ steps.refresh_mode.outputs.mode }}"
          # Zwykle 0 dodatkowych requestów. API jest używane tylko,
          # gdy po meczu zmieni się next_match / next_opponent.
          python scripts/update_context.py --mode auto

      - name: Commit refreshed data
        if: steps.freshness.outputs.run_api == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/i_liga_standing.json             data/lks_match_search.json             data/lks_current_season.json             data/dashboard.json             data/context.json

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Refresh LKS dashboard data"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push nie udał się (próba $attempt/3); ponawiam bez odpytywania API."
            sleep 2
          done

          exit 1
