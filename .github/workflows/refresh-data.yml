name: Refresh ŁKS dashboard data

on:
  schedule:
    # Pełny refresh 4 razy w tygodniu: tabela + terminarz (2 requesty).
    - cron: "17 6 * * 1,3,5,0"

    # W pozostałe poranki: tylko terminarz (1 request).
    - cron: "17 6 * * 2,4,6"

    # Dodatkowy refresh terminarza po weekendowych dniach meczowych.
    - cron: "17 19 * * 5,6,0"

  workflow_dispatch:
    inputs:
      mode:
        description: "Zakres aktualizacji"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - matches

permissions:
  contents: write

# Wszystkie workflow zapisujące dane korzystają z jednej kolejki.
# Dzięki temu nie ścigają się przy pushu do main.
concurrency:
  group: lks-repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Choose refresh mode
        id: refresh_mode
        shell: bash
        run: |
          MODE="matches"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "17 6 * * 1,3,5,0" ]]; then
            MODE="full"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Wybrany tryb: $MODE"

      - name: Refresh API data and rebuild dashboard
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/update_dashboard.py --mode "${{ steps.refresh_mode.outputs.mode }}"

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/i_liga_standing.json             data/lks_match_search.json             data/lks_current_season.json             data/dashboard.json

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Refresh LKS dashboard data"

          # Retry dotyczy wyłącznie zapisu do GitHuba — NIE wykonuje ponownie requestów API.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push nie udał się (próba $attempt/3); ponawiam bez odpytywania API."
            sleep 2
          done

          exit 1
