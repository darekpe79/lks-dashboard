name: Test RapidAPI - I liga

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: One API request - I liga standings
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/test_api.py

      - name: Save updated JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/i_liga_standing.json
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Update I liga standings"
            git push
          fi
