name: Refresh ŁKS context data

on:
  schedule:
    # Raz w tygodniu, 30 minut po poniedziałkowym pełnym refreshu.
    - cron: "47 6 * * 1"

  workflow_dispatch:

permissions:
  contents: write

# Ta sama kolejka co główny refresh: tylko jeden workflow naraz zapisuje do main.
concurrency:
  group: lks-repo-writes
  cancel-in-progress: false

jobs:
  refresh-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh context data
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/update_context.py

      - name: Commit context data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/context.json data/dashboard.json

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Refresh LKS context data"

          # Retry dotyczy wyłącznie zapisu do GitHuba — NIE wykonuje ponownie requestów API.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push nie udał się (próba $attempt/3); ponawiam bez odpytywania API."
            sleep 2
          done

          exit 1
