name: Refresh ŁKS context data

on:
  schedule:
    # Wtorkowa kontrola po porannym refreshu.
    # Jeżeli home/away były odświeżone przy zmianie rywala
    # w ostatnich 5 dniach, koszt = 0 requestów.
    - cron: "47 7 * * 2"
      timezone: "Europe/Warsaw"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lks-repo-writes
  cancel-in-progress: false

jobs:
  refresh-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh context data if stale
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/update_context.py --mode weekly

      - name: Commit context data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/context.json data/dashboard.json

          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi

          git commit -m "Refresh LKS context data"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push nie udał się (próba $attempt/3); ponawiam bez odpytywania API."
            sleep 2
          done

          exit 1
